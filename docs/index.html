<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slippy</title>
<meta name="description" content="Slippy lets AI agents hop into Adobe Illustrator and Photoshop.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
	:root { --bg: #0b0c0e; --text: #e6e6e6; --dim: #7c7f87; --green: #92f607; }
	* { box-sizing: border-box; }
	/* Phones: no automatic text enlarging (it scaled some of his lines and not
	   others), and no sideways scroll from the art's empty edges. */
	html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
	html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
	body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; min-height: 100vh;
		display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
	#frog { margin: 0; font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #3b4a36;
		white-space: pre; user-select: none; letter-spacing: 0; }
	#frog b { color: var(--green); font-weight: 600; }
	/* The Z's float above the art in their own layer, so they take no room. */
	.stage { position: relative; }
	#zs { position: absolute; left: 0; margin: 0; font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
		white-space: pre; pointer-events: none; color: var(--green); }
	h1 { margin: 28px 0 4px; font-size: 32px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
	.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
	/* The version, boxed as in Slippy's panels. */
	.version { margin: 28px 0 10px; font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--dim); border: 1.5px solid #3a3d44;
		border-radius: 5px; padding: 1px 7px; }
	p { margin: 0; color: var(--dim); text-align: center; }
	/* Side by side, sized to their text, centered - as on ghostty.org. */
	.downloads { display: flex; gap: 12px; margin-top: 32px; justify-content: center; }
	/* Each button as ghostty.org's: 16px regular, 10px 34px, 6px corners, a
	   background fade on hover. Illustrator and Photoshop open a small menu of
	   their downloads below, without moving anything. */
	.app { position: relative; border: 1px solid var(--green); border-radius: 6px; transition: background-color 0.15s; }
	.app summary { list-style: none; cursor: pointer; padding: 10px 34px; font-size: 16px; font-weight: 400; color: #f0f0f4;
		text-align: center; user-select: none; }
	.app summary::-webkit-details-marker { display: none; }
	.app:hover, .app[open] { background-color: rgba(146, 246, 7, 0.08); }
	.app .menu { position: absolute; z-index: 5; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: 260px;
		padding: 6px; border: 1px solid #242428; border-radius: 8px; background: #16161a; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); }
	.app .menu a { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 5px;
		color: var(--text); text-decoration: none; font-size: 14px; }
	.app .menu a:hover { background: #242428; }
	.app .menu a span { color: var(--dim); }
	/* The docs: the same button, gray outline. */
	.app.docs-button { border-color: #4c4c50; color: #f0f0f4; text-decoration: none; padding: 10px 34px; font-size: 16px; font-weight: 400; }
	.app.docs-button:hover { background-color: #16161a; }
	/* Phones: stacked, full width; the menu opens below in the flow. */
	@media (max-width: 560px) {
		.downloads { flex-direction: column; width: 100%; max-width: 360px; }
		.app { width: 100%; text-align: center; }
		.app .menu { position: static; transform: none; width: auto; margin: 0 8px 8px; box-shadow: none; }
	}
	footer { margin-top: 36px; font-size: 13px; color: var(--dim); }
	footer a { color: var(--dim); }
</style>
</head>
<body>
<pre id="burst" aria-hidden="true"></pre>
<nav><button type="button" id="logo" aria-label="Slippy - play the burst"><img src="navlogo.svg" alt=""></button></nav>
<div class="stage"><pre id="zs" aria-hidden="true"></pre><pre id="frog" aria-label="Slippy the frog"></pre></div>
<h1 class="visually-hidden">Slippy</h1>
<span class="version" id="version">v0.1.1</span>
<p>Let agents hop in</p>

<div class="downloads" id="downloads">
	<details class="app">
		<summary>Illustrator</summary>
		<div class="menu">
			<a href="https://github.com/tonykastaneda/slippy/releases/latest/download/Slippy-Illustrator-macos.zip">macOS <span>.aip</span></a>

		</div>

	<details class="app">

		<div class="menu">
			<a href="https://github.com/tonykastaneda/slippy/releases/latest/download/Slippy-Photoshop-macos.zip">macOS <span>.plugin + .ccx</span></a>
			<a href="https://github.com/tonykastaneda/slippy/releases/latest/download/Slippy-Photoshop-windows-x64.zip">Windows x64 <span>.8li + .ccx</span></a>
			<a href="https://github.com/tonykastaneda/slippy/releases/latest/download/Slippy-Photoshop-windows-ARM64.zip">Windows ARM64 <span>.8li + .ccx</span></a>

<footer><a href="docs/">Docs</a> · <a href="https://github.com/tonykastaneda/slippy">GitHub</a></footer>

<script>
// Slippy in ASCII, drawn live: his shape (the same proportions as the
// plug-ins' frog) shaded like a lit, rounded surface into a character ramp,
// his outline in green - in the spirit of ghostty.org's ghost. He sleeps
// (Z's), wakes, hops, looks around, blinks, and dozes off again, in a loop.
(function () {
	const COLS = 100, ROWS = 42;           // character grid, with room on his left for the Z's
	const ASPECT = 1.65;                 // a monospace cell's height / width at line-height 1
	const RAMP = " ·:~=+ox*%$@";        // dark -> bright
	const LOOP = 14000;                  // ms for the whole story
	const pre = document.getElementById("frog");
	const zpre = document.getElementById("zs");
	const Z_TOP = -10, Z_BOTTOM = 10;
	let celebrateAt = -1e9;   // when a download was clicked (ms into the animation)
	// Every ripple and burst still playing, each {at, burst}: a new click adds
	// one, on top of the others, and each plays out on its own.
	const effects = [];
	const RIPPLE_MS = 1300;
	function addEffect(burst) {
		celebrateAt = performance.now() - start;   // he hops for the latest
		effects.push({ at: celebrateAt, burst });
	}
	const burstPre = document.getElementById("burst");
	const BURST_MS = 2400, BURST_RINGS = 6, BURST_GAP = 170;

	// The burst: rings in his outline growing from him past the window's
	// edges, a beat apart, each a moving rainbow, fading at the end.
	function drawBurst(ms) {
		// Drop the finished ones; nothing left, nothing to draw.
		for (let i = effects.length - 1; i >= 0; i--) {
			const life = effects[i].burst ? BURST_MS + BURST_RINGS * BURST_GAP : RIPPLE_MS;
			if (ms - effects[i].at > life) effects.splice(i, 1);
		}
		if (!effects.length) { if (burstPre.innerHTML) burstPre.innerHTML = ""; return; }
		// Character cell size, and where his middle is on screen.
		const probe = drawBurst.cell || (drawBurst.cell = (() => {
			const sp = document.createElement("span"); sp.textContent = "M".repeat(10);
			// Measured inside the burst layer itself, so it has its exact font (Firefox
			// reports no "font" shorthand to copy).
			sp.style.position = "absolute"; sp.style.visibility = "hidden";
			burstPre.appendChild(sp); const r = sp.getBoundingClientRect(); sp.remove();
			return { w: r.width / 10, h: parseFloat(getComputedStyle(burstPre).fontSize) };
		})());
		const fr = pre.getBoundingClientRect();
		const fcw = fr.width / COLS, fch = fr.height / ROWS;           // the art's cells, on screen
		const unitX = 1 / (COLS * 0.62) / fcw, unitY = unitX;         // his units per screen pixel
		const cxPx = fr.left + fr.width / 2, cyPx = fr.top + (ROWS - 2) * fch - 0.41 / unitY;
		const cols = Math.ceil(innerWidth / probe.w), rows = Math.ceil(innerHeight / probe.h);
		const reach = Math.hypot(innerWidth, innerHeight) * unitX * 1.3;   // how big the last ring must get
		const rings = [];
		for (const fx of effects) {
		const since = ms - fx.at;
		if (!fx.burst) for (const delay of [0, 260]) {   // two rings, a beat apart, to 1.6x his size, fading
			const t = (since - delay) / 1000;
			if (t > 0 && t < 1) rings.push({ k: 1 + 0.6 * (1 - Math.pow(1 - t, 3)), a: 0.9 * (1 - t), green: true, band: 1 });
		}
		if (fx.burst) for (let i = 0; i < BURST_RINGS; i++) {
			const t = (since - i * BURST_GAP) / BURST_MS;
			if (t <= 0 || t >= 1) continue;
			// Slow by him, faster as it goes: it lingers thick around him, then
			// races out thinning to a single character at the window's edges.
			const k = 1 + reach * Math.pow(t, 1.45);
			rings.push({ k, a: 0.85 * (t < 0.8 ? 1 : (1 - t) / 0.2), hue: (i * 50 + since * 0.25) % 360, band: 1 + 2 * Math.pow(1 - t, 1.3) });
		}
		}
		let out = "";
		for (let r = 0; r < rows; r++) {
			let line = "";
			const py = (r + 0.5) * probe.h;
			for (let c = 0; c < cols; c++) {
				const px = (c + 0.5) * probe.w;
				const x = 0.5 + (px - cxPx) * unitX, y = 0.41 - (py - cyPx) * unitY;
				let hit = null;
				for (const g of rings) {
					const inside = (dx, dy) => bodyHeight(0.5 + (x + dx - 0.5) / g.k, 0.41 + (y + dy - 0.41) / g.k) >= 0;
					const e = probe.w * unitX * g.band, f = probe.h * unitY * g.band * 0.75;   // ~band characters across, ~band rows tall
					if (inside(0, 0) && (!inside(e, 0) || !inside(-e, 0) || !inside(0, f) || !inside(0, -f))) { hit = g; break; }
				}
				if (!hit) { line += " "; continue; }
				if (hit.green) { line += `<span style="color: rgba(146, 246, 7, ${hit.a.toFixed(2)})">@</span>`; continue; }
				const hue = (hit.hue + Math.atan2(y - 0.41, x - 0.5) * 57.3 + 360) % 360;
				line += `<span style="color: hsla(${hue.toFixed(0)}, 95%, 60%, ${hit.a.toFixed(2)})">@</span>`;
			}
			out += line + "\n";
		}
		burstPre.innerHTML = out;
	}
	const still = new URLSearchParams(location.search).get("t");   // ?t=<ms>: one moment, still
	// Reduce Motion: smaller moves (a third, as in the plug-ins' panels), not none.
	const MOTION = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.35 : 1;

	// Shape, in units of his width, y up from his bottom (FrogShape.h).
	const HEAD = { cx: 0.5, cy: 0.305, rx: 0.5, ry: 0.305 };
	const EYE_X = 0.208, EYE_Y = 0.61, BUMP_R = 0.2078;

	const smooth = (t) => t * t * (3 - 2 * t);
	const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
	const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

	// The story at time t (0..1 of the loop): his pose.
	function pose(ms) {
		const t = (ms % LOOP) / LOOP;
		const p = { hop: 0, sq: 1, look: 0, lookY: 0, eyes: 1, asleep: false, happy: false, breath: 0 };
		const breathe = Math.sin(ms / 520) * (t < 0.18 || t > 0.86 ? 0.03 : 0.012);
		p.breath = breathe;
		if (t < 0.18 || t > 0.9) { p.asleep = true; return p; }                 // asleep
		if (t < 0.24) { p.happy = true; }                                       // wakes, ^ ^
		const h = seg(t, 0.2, 0.3);                                              // the hop
		if (h > 0 && h < 1) {
			p.hop = Math.sin(Math.PI * h) * 0.12;
			p.sq = h < 0.12 ? 1 - 0.1 * Math.sin(Math.PI * h / 0.12) : h > 0.88 ? 1 - 0.12 * Math.sin(Math.PI * (h - 0.88) / 0.12) : 1.04;
		}
		// Looking around: held glances.
		const looks = [[0.32, 0], [0.38, -1], [0.48, 1], [0.58, -0.4], [0.66, 0.9], [0.74, 0]];
		let lx = 0;
		for (let i = 0; i < looks.length - 1; i++) {
			const [a, va] = looks[i], [b, vb] = looks[i + 1];
			if (t >= a && t < b) lx = va + (vb - va) * smooth(seg(t, a, a + 0.025));
		}
		if (t >= looks[looks.length - 1][0]) lx = 0;
		p.look = lx;
		p.lookY = Math.sin(t * 40) * 0.15;
		// Blinks.
		for (const b of [0.35, 0.53, 0.56, 0.7]) { const d = Math.abs(t - b); if (d < 0.008) p.eyes = d / 0.008; }
		// A second hop of joy, then dozing: ^ ^, a nod.
		const h2 = seg(t, 0.78, 0.83);
		if (h2 > 0 && h2 < 1) { p.hop = Math.sin(Math.PI * h2) * 0.08; p.happy = true; }
		if (t > 0.84) { p.happy = true; p.hop = -0.02 * Math.sin(Math.PI * seg(t, 0.84, 0.9)); }
		return p;
	}

	// Height of his rounded surface at (x, y), 0 outside: the union of the head
	// and the two bumps, each a dome.
	// His surface: inside the head, its own (the bumps blend in, no shadow under
	// them); above it, the bumps. -1 outside him.
	function bodyHeight(x, y) {
		const head = dome(x, y, HEAD.cx, HEAD.cy, HEAD.rx, HEAD.ry);
		if (head >= 0) return head;
		return Math.max(dome(x, y, 0.5 - EYE_X, EYE_Y, BUMP_R, BUMP_R), dome(x, y, 0.5 + EYE_X, EYE_Y, BUMP_R, BUMP_R));
	}

	function dome(x, y, cx, cy, rx, ry) {
		const u = (x - cx) / rx, v = (y - cy) / ry, d = u * u + v * v;
		return d < 1 ? Math.sqrt(1 - d) : -1;
	}

	// A block-letter Z in its unit box (x right, y up): top bar, bottom bar and
	// the diagonal between them.
	function inZ(x, y) {
		if (x < 0 || x > 1 || y < 0 || y > 1) return false;
		const bar = 0.3, t = 0.62;   // bar height; diagonal thickness, across x
		if (y > 1 - bar || y < bar) return true;
		const dx = x - y;            // the diagonal runs (0,0) - (1,1)
		return Math.abs(dx) < t / 2;
	}

	// The Z's this frame: small, medium, large along a diagonal from just above
	// his left eye up and to the left, each fading in after the one before,
	// all drifting along it, then fading out, again. In grid cells (rows can
	// be negative: above the art).
	const Z_FROM = [32.5, 9.6], Z_TO = [8.5, -6];
	function zs(ms, asleep) {
		if (!asleep) return [];
		const cycle = (ms % 4200) / 4200;
		const out = [];
		[[0.1, 4], [0.47, 5], [0.84, 6]].forEach(([along, h], k) => {
			const on = clamp((cycle - k * 0.2) / 0.12, 0, 1) * clamp((0.94 - cycle) / 0.12, 0, 1);
			if (on <= 0.02) return;
			const a = along + cycle * 0.06;
			const cx = Z_FROM[0] + (Z_TO[0] - Z_FROM[0]) * a, cy = Z_FROM[1] + (Z_TO[1] - Z_FROM[1]) * a;
			const w = h * ASPECT * 0.95;
			out.push({ c: cx - w / 2, r: cy - h / 2, h, w, on });
		});
		return out;
	}

	// The Z cell at (r, c): its alpha if (r, c) is on a Z's outline, else 0.
	function zCell(list, r, c) {
		for (const z of list) {
			const at = (rr, cc) => inZ((cc + 0.5 - z.c) / z.w, 1 - (rr + 0.5 - z.r) / z.h);
			if (!at(r, c)) continue;
			if (!at(r - 1, c) || !at(r + 1, c) || !at(r, c - 1) || !at(r, c + 1)) return z.on;
		}
		return 0;
	}

	function draw(ms) {
		const p = pose(ms);
		const since = ms - celebrateAt;
		if (since >= 0 && since < 1800) {
			p.asleep = false; p.happy = true; p.eyes = 1;
			const h = clamp(since / 650, 0, 1);
			p.hop = Math.sin(Math.PI * h) * 0.1;
			p.sq = h < 0.12 ? 1 - 0.1 * Math.sin(Math.PI * h / 0.12) : h > 0.88 ? 1 - 0.12 * Math.sin(Math.PI * (h - 0.88) / 0.12) : 1.04;
		}
		const W = 0.62;                      // his width, as a share of the grid's width
		const sx = 1 + (1 - p.sq) * 0.6, sy = p.sq * (1 + p.breath);
		const cellW = 1 / (COLS * W);        // grid cell -> his units
		const cellH = cellW * ASPECT;
		const ox = 0.5 * COLS, base = ROWS - 2;   // his bottom-center, in cells
		const lift = p.hop / cellH;
		const light = [-0.5, 0.65, 0.58];    // from the upper left, toward the viewer
		const eyes = [-1, 1].map((s) => ({ x: 0.5 + s * EYE_X + p.look * 0.045, y: EYE_Y + p.lookY * 0.02 }));

		const height = bodyHeight;

		const zList = zs(ms, p.asleep);
		let out = "";
		for (let r = 0; r < ROWS; r++) {
			let line = "";
			for (let c = 0; c < COLS; c++) {
				// Cell center -> his coordinates (with the squash about his bottom).
				const x = 0.5 + ((c + 0.5 - ox) * cellW) / sx;
				const y = ((base - lift - (r + 0.5)) * cellH) / sy;
				const z = height(x, y);
				let ch = " ", kind = "";
				if (z >= 0) {
					// The outline: a band about three characters thick - how far in
					// from his edge this cell is, in character widths (1, 2, 3; 0 = deeper).
					let edge = 0;
					for (let k = 1; k <= 3 && !edge; k++) {
						const rr = cellW * (k - 0.35);
						for (let a = 0; a < 12; a++) {
							const ang = (a / 12) * 2 * Math.PI;
							if (height(x + rr * Math.cos(ang), y + rr * Math.sin(ang)) < 0) { edge = k; break; }
						}
					}
					// Eyes: solid dark ovals; closed, a line; happy, a caret.
					let eye = false, lid = false;
					for (const ey of eyes) {
						const dx = (x - ey.x) / 0.087, dy = (y - ey.y) / 0.095;
						if (p.asleep) { if (Math.abs(dx) < 1.1 && Math.abs(dy + 0.1 - 0.3 * dx * dx) < 0.26) lid = true; }
						else if (p.happy) { if (Math.abs(dx) < 1.1 && Math.abs(dy - 0.3 + 0.8 * Math.abs(dx)) < 0.3) lid = true; }
						else if (dx * dx + (dy / Math.max(0.05, p.eyes)) * (dy / Math.max(0.05, p.eyes)) < 1) eye = true;
						else if (p.eyes < 0.3 && Math.abs(dx) < 1 && Math.abs(dy) < 0.2) lid = true;
					}
					if (eye) { ch = " "; }
					else if (lid) { ch = " "; }   // closed and happy eyes are cut out too, like open ones
					else if (edge) { ch = "@%+"[edge - 1]; kind = "b"; }
					else {
						// Shade: the surface normal from the height field, lit.
						const d = 0.004;
						const nx = (height(x - d, y) - height(x + d, y)) / (2 * d) * 0.12;
						const ny = (height(x, y - d) - height(x, y + d)) / (2 * d) * 0.12;
						const n = Math.hypot(nx, ny, 1);
						const lit = clamp((nx * light[0] + ny * light[1] + light[2]) / n, 0, 1);
						const v = clamp(0.15 + 0.85 * lit * (0.55 + 0.45 * z), 0, 0.999);
						ch = RAMP[Math.floor(v * RAMP.length)];
					}
				}
				line += kind ? `<${kind}>${ch === "<" ? "&lt;" : ch}</${kind}>` : ch;
			}
			out += line + "\n";
		}
		pre.innerHTML = out;
		// The Z layer: rows Z_TOP..Z_BOTTOM of the grid (above the art), its
		// bottom lined up with grid row Z_BOTTOM.
		let zo = "";
		if (zList.length) {
			for (let r = Z_TOP; r <= Z_BOTTOM; r++) {
				let line = "";
				for (let c = 0; c < COLS; c++) {
					const a = zCell(zList, r, c);
					line += a ? `<span style="opacity: ${a.toFixed(2)}">@</span>` : " ";
				}
				zo += line.replace(/\s+$/, "") + "\n";
			}
		}
		zpre.innerHTML = zo;
	}

	// Puts a green character at visible column c of a line that may hold tags.
	function place(line, c, chr, alpha = 1) {
		let col = 0, i = 0;
		while (i < line.length && col < c) {
			if (line[i] === "<") { i = line.indexOf(">", i) + 1; if (line[i - 2] === "/" || line[i - 3] === "/") continue; continue; }
			if (line[i] === "&") i = line.indexOf(";", i);
			i++; col++;
		}
		if (line[i] === " ") return line.slice(0, i) + `<b style="color: rgba(146, 246, 7, ${alpha.toFixed(2)})">${chr}</b>` + line.slice(i + 1);
		return line;
	}

	// Phones: size the art so Slippy himself spans the screen less a small
	// margin - as big as fits, never clipped. (The art's empty edges, room for
	// the Z's, may run off the sides; the page doesn't scroll sideways.)
	function fit() {
		if (innerWidth > 560) { pre.style.fontSize = zpre.style.fontSize = ""; return; }
		const sp = document.createElement("span");
		sp.textContent = "M".repeat(20); sp.style.position = "absolute"; sp.style.visibility = "hidden"; sp.style.fontSize = "10px";
		pre.appendChild(sp); const perPx = sp.getBoundingClientRect().width / 20 / 10; sp.remove();   // a character's width per px of font size
		const hisCols = COLS * 0.62 + 4;   // his width in characters, with room for his outline and a squash
		const size = Math.min(12, (innerWidth - 24) / (hisCols * perPx));
		pre.style.fontSize = zpre.style.fontSize = size.toFixed(2) + "px";
	}
	fit();
	addEventListener("resize", fit);
	zpre.style.bottom = `${ROWS - Z_BOTTOM - 1}em`;   // the layer's last row sits on grid row Z_BOTTOM
	const cParam = new URLSearchParams(location.search).get("c");
	const bParam = new URLSearchParams(location.search).get("b");
	if (still !== null) {
		if (cParam !== null) { celebrateAt = +still - +cParam; effects.push({ at: celebrateAt, burst: false }); }
		if (bParam !== null) { celebrateAt = +still - +bParam; effects.push({ at: celebrateAt, burst: true }); }
		draw(+still); drawBurst(+still); return;
	}
	// The version badge: the latest release on GitHub, so publishing a release
	// updates it (the text in the page is only a fallback).
	fetch("https://api.github.com/repos/tonykastaneda/slippy/releases/latest")
		.then((r) => (r.ok ? r.json() : null))
		.then((rel) => { if (rel && /^v\d/.test(rel.tag_name || "")) document.getElementById("version").textContent = rel.tag_name; })
		.catch(() => {});
	let start = performance.now();
	// A download click: Slippy wakes, hops for joy, and rings in his outline
	// radiate out from him - the panels' ripple.
	document.querySelectorAll(".app a").forEach((a) => a.addEventListener("click", () => addEffect(false)));
	// Download menus: one open at a time; a click anywhere else closes it.
	const menus = document.querySelectorAll("details.app");
	menus.forEach((d) => d.addEventListener("toggle", () => { if (d.open) menus.forEach((o) => { if (o !== d) o.open = false; }); }));
	document.addEventListener("click", (e) => { menus.forEach((d) => { if (d.open && !d.contains(e.target)) d.open = false; }); });
	// Slippy himself: a click on him (not the space around him) wakes him with
	// the download ripple. The pointer turns to a hand over him.
	function onSlippy(ev) {
		const rect = pre.getBoundingClientRect();
		const c = (ev.clientX - rect.left) / (rect.width / COLS), r = (ev.clientY - rect.top) / (rect.height / ROWS);
		const cellW = 1 / (COLS * 0.62), cellH = cellW * ASPECT;
		const x = 0.5 + (c - 0.5 * COLS) * cellW, y = (ROWS - 2 - r) * cellH;
		return bodyHeight(x, y) >= 0;
	}
	pre.addEventListener("mousemove", (ev) => { pre.style.cursor = onSlippy(ev) ? "pointer" : ""; });
	pre.addEventListener("click", (ev) => { if (onSlippy(ev)) addEffect(false); });
	// The logo: the full-window rainbow burst.
	document.getElementById("logo").addEventListener("click", () => addEffect(true));
	function frame(now) { draw(now - start); drawBurst(now - start); requestAnimationFrame(frame); }
	requestAnimationFrame(frame);
})();
</script>
</body>
</html>
