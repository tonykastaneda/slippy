<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="panel">
		<div class="header">
			<div class="mascot" id="mascot"></div>
			<div class="titles">
				<div class="title-row"><span class="title">Slippy</span><span class="badge" id="version">v.</span></div>
				<div class="counts-row"><span class="agent" id="agent"></span><span id="counts">0 calls • 0 errors</span></div>
			</div>
		</div>
		<div class="bars" id="bars"></div>
		<div class="status-row">
			<div class="status" id="status"><span class="dot"></span><span id="status-text">Starting…</span></div>
			<div class="copy" id="copy" role="button">Copy connection</div>
		</div>
		<div class="feed" id="feed"><div class="empty" id="empty">Calls from agents show up here.</div></div>
	</div>
	<script src="mascot.js"></script>
	<script src="panel.js"></script>
	<script src="main.js"></script>
</body>
</html>
