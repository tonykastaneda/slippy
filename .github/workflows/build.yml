# Builds all of Slippy's plug-ins:
#   Slippy for Illustrator  - macOS Slippy.aip, Windows Slippy.aip (x64, ARM64)
#   Slippy for Photoshop    - macOS Slippy.plugin, Windows Slippy.8li (x64, ARM64), each with
#                             Slippy.ccx, its docked panel (UXP; one file for both systems)
# The macOS ones are signed with Developer ID and notarized when the secrets
# are set (ad hoc otherwise). A v* tag also publishes them all as a release.
#
# The Adobe SDKs are not in the repository. Encrypted copies (AES-256) are
# in this repo's "sdk-illustrator-2026" and "sdk-photoshop-2026" releases;
# CI decrypts them with the SDK_KEY secret (also in the owner's Keychain as
# "Slippy CI SDK key"). Pull requests from forks get no secrets, so they
# don't build.
#
# macOS signing / notarization, all optional:
#   secrets.MACOS_CERT_P12       base64 of the Developer ID Application .p12
#   secrets.MACOS_CERT_PASSWORD  that .p12's password
#   secrets.APPLE_ID             the Apple ID email
#   secrets.APPLE_APP_PASSWORD   an app-specific password for it
#   vars.APPLE_TEAM_ID           the team (GM98GV6S97)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    env:
      SDK: ${{ github.workspace }}/../sdk/AdobeIllustratorSDK
      PS_SDK: ${{ github.workspace }}/../sdk/AdobePhotoshopSDK/pluginsdk/photoshopapi
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && vars.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Download the SDKs
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_KEY: ${{ secrets.SDK_KEY }}
        run: |
          for z in AdobeIllustratorSDK AdobePhotoshopSDK; do
            tag=$([ $z = AdobeIllustratorSDK ] && echo sdk-illustrator-2026 || echo sdk-photoshop-2026)
            gh release download $tag --repo "$GITHUB_REPOSITORY" --pattern $z.zip.enc --dir "$RUNNER_TEMP"
            printf '%s' "$SDK_KEY" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/$z.zip.enc" -out "$RUNNER_TEMP/$z.zip" -pass stdin
          done
          mkdir -p "$SDK/.."
          unzip -q "$RUNNER_TEMP/AdobeIllustratorSDK.zip" -d "$SDK/.."
          unzip -q "$RUNNER_TEMP/AdobePhotoshopSDK.zip" -d "$SDK/.."

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            SIGN=(SIGN_ID="Developer ID Application" SIGN_FLAGS="--timestamp --options runtime")
          else
            echo "::notice::No signing certificate in the secrets - signing ad hoc."
            SIGN=()
          fi
          make SDK="$SDK" "${SIGN[@]}"
          make photoshop PS_SDK="$PS_SDK" "${SIGN[@]}"
          codesign -dv --verbose=2 build/Slippy.aip
          codesign -dv --verbose=2 build/ps/Slippy.plugin

      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for bundle in build/Slippy.aip build/ps/Slippy.plugin; do
            ditto -c -k --keepParent "$bundle" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
            cat "$RUNNER_TEMP/notary.json"
            STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$RUNNER_TEMP/notary.json" || true)
            if [ "$STATUS" != "Accepted" ]; then
              ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$RUNNER_TEMP/notary.json" || true)
              [ -n "$ID" ] && xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              echo "::error::Notarization of $bundle failed (status: ${STATUS:-none})"
              exit 1
            fi
            # Stapling lets Gatekeeper check offline; a plug-in bundle may not
            # take a ticket, and it still passes online without one.
            xcrun stapler staple "$bundle" || echo "::warning::Couldn't staple $bundle; Gatekeeper will check online."
          done

      - name: Package
        run: |
          ditto -c -k --keepParent build/Slippy.aip Slippy-Illustrator-macos.zip
          mkdir -p ps-macos && ditto build/ps/Slippy.plugin ps-macos/Slippy.plugin && cp build/ps/Slippy.ccx ps-macos/
          (cd ps-macos && ditto -c -k --sequesterRsrc . ../Slippy-Photoshop-macos.zip)

      - name: Upload Illustrator plug-in
        uses: actions/upload-artifact@v5
        with:
          name: Slippy-Illustrator-macos
          path: Slippy-Illustrator-macos.zip
          if-no-files-found: error

      - name: Upload Photoshop plug-in
        uses: actions/upload-artifact@v5
        with:
          name: Slippy-Photoshop-macos
          path: Slippy-Photoshop-macos.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v5

      - name: Download the SDKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_KEY: ${{ secrets.SDK_KEY }}
        run: |
          for z in AdobeIllustratorSDK AdobePhotoshopSDK; do
            tag=$([ $z = AdobeIllustratorSDK ] && echo sdk-illustrator-2026 || echo sdk-photoshop-2026)
            gh release download $tag --repo "$GITHUB_REPOSITORY" --pattern $z.zip.enc --dir "$RUNNER_TEMP"
            printf '%s' "$SDK_KEY" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/$z.zip.enc" -out "$RUNNER_TEMP/$z.zip" -pass stdin
          done

      - name: Unpack the SDKs
        shell: pwsh
        run: |
          Expand-Archive "$env:RUNNER_TEMP\AdobeIllustratorSDK.zip" -DestinationPath "$env:RUNNER_TEMP\sdk"
          Expand-Archive "$env:RUNNER_TEMP\AdobePhotoshopSDK.zip" -DestinationPath "$env:RUNNER_TEMP\sdk"

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-win -A ${{ matrix.arch }} -DAI_SDK="$env:RUNNER_TEMP\sdk\AdobeIllustratorSDK" -DPS_SDK="$env:RUNNER_TEMP\sdk\AdobePhotoshopSDK"

      - name: Build
        shell: pwsh
        run: cmake --build build-win --config Release

      - name: Package the Photoshop panel
        shell: pwsh
        run: |
          python tools/package_panel.py build-win/photoshop/Release/Slippy.ccx

      - name: Upload Illustrator plug-in
        uses: actions/upload-artifact@v5
        with:
          name: Slippy-Illustrator-windows-${{ matrix.arch }}
          path: build-win/illustrator/Release/Slippy.aip
          if-no-files-found: error

      - name: Upload Photoshop plug-in
        uses: actions/upload-artifact@v5
        with:
          name: Slippy-Photoshop-windows-${{ matrix.arch }}
          path: |
            build-win/photoshop/Release/Slippy.8li
            build-win/photoshop/Release/Slippy.ccx
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches VERSION
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($want). Set VERSION, commit, then tag."
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for arch in x64 ARM64; do
            (cd "Slippy-Illustrator-windows-$arch" && zip -q "../Slippy-Illustrator-windows-$arch.zip" Slippy.aip)
            (cd "Slippy-Photoshop-windows-$arch" && zip -q "../Slippy-Photoshop-windows-$arch.zip" Slippy.8li Slippy.ccx)
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Slippy $GITHUB_REF_NAME" --generate-notes \
            Slippy-Illustrator-macos/Slippy-Illustrator-macos.zip Slippy-Photoshop-macos/Slippy-Photoshop-macos.zip \
            Slippy-Illustrator-windows-x64.zip Slippy-Illustrator-windows-ARM64.zip \
            Slippy-Photoshop-windows-x64.zip Slippy-Photoshop-windows-ARM64.zip
